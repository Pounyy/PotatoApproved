backend:
  name: github
  repo: Pounyy/PotatoApproved
  branch: main

media_folder: public/games
public_folder: /games

collections:
  - name: games
    label: Games
    label_singular: Game
    folder: src/content/games
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - { label: Potato Approved, value: potato }
          - { label: Fries Approved, value: fries }
      - { label: Cover image, name: image, widget: image }
      - { label: Year, name: year, widget: number, value_type: int, min: 1970, max: 2100 }
      - { label: Genre, name: genre, widget: string }
      - { label: Hardware, name: hardware, widget: string }
      - { label: Performance, name: performance, widget: string }
      - { label: Short description, name: description, widget: text }
      - { label: Store URL, name: storeUrl, widget: string, required: false }
      - { label: Store label, name: storeLabel, widget: string, required: false }
